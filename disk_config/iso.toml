[customizations.installer.kickstart]
contents = """
timezone Europe/Vienna --utc
keyboard --xlayouts=us,de --switch=grp:alt_shift_toggle

%post
bootc switch --mutate-in-place --transport registry git.srvb.at/srvb/hyprfreeze:latest

# Anaconda writes a "/" line into /etc/fstab, but composefs (used by bootc)
# rejects the remount systemd-remount-fs.service tries to apply from it at
# every boot (mount: /: fsconfig ... overlay: No changes allowed in
# reconfigure). Drop just that line, keep /boot, /boot/efi, swap, etc.
# See: https://github.com/bootc-dev/bootc/issues/971
awk '$2 != "/"' /etc/fstab > /etc/fstab.new && mv /etc/fstab.new /etc/fstab
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
