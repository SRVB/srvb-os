---
name: Build disk images

on:
  workflow_run:
    workflows:
      - Build container image
    branches:
      - main
    types:
      - completed
  workflow_dispatch: {}

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check disk configuration changes
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      disk_config: ${{ steps.result.outputs.disk_config }}
    steps:
      - name: Checkout associated commit
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # dorny/paths-filter resolves the correct diff range via the compare API,
      # unlike a plain git diff-tree which only sees the latest commit.
      - name: Check changed files
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.workflow_run.head_branch }}
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            disk_config:
              - 'disk_config/**'

      - name: Determine result
        id: result
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "disk_config=true" >> "${GITHUB_OUTPUT}"
          else
            echo "disk_config=${{ steps.filter.outputs.disk_config }}" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.disk_config == 'true'
    name: Build ISO image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        id: environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "user_uid=${USER_UID}" >> ${GITHUB_OUTPUT}
          echo "user_gid=${USER_GID}" >> ${GITHUB_OUTPUT}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@56d652d0afb02eb3e4b8fd35e7ca0391dbebab2a # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ steps.environment.outputs.user_uid }}:${{ steps.environment.outputs.user_gid }}
          types: anaconda-iso
          additional-args: --use-librepo=True --rootfs=btrfs

      - name: Upload to S3
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}
