# Umbriel configuration entry point. Installed to /etc/xdg/umbriel by the image
# build; ~/.config/umbriel/config.toml takes precedence for user overrides.
# Category files are loaded in order; personal overrides are loaded last.

[include]
files = [
    "general.toml",
    "workspaces.toml",
    "appearance.toml",
    "input.toml",
    "scratchpads.toml",
    "keybinds.toml",
    "layout.toml",
    "window-rules.toml",
    "layer-rules.toml",
    "animation.toml",
    "overview.toml",
    "security.toml",
]

[include.optional]
files = ["~/.config/umbriel/noctalia.toml"]
