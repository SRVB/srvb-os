# Umbriel configuration entry point.
# Category files are loaded in order; personal overrides are loaded last.

[include]
files = [
    "general.toml",
    "outputs.toml",
    "workspaces.toml",
    "colors.toml",
    "appearance.toml",
    "input.toml",
    "scratchpads.toml",
    "keybinds.toml",
    "layout.toml",
    "window-rules.toml",
    "layer-rules.toml",
    "animation.toml",
    "overview.toml",
    "security.toml",
]

[include.optional]
files = ["noctalia.toml"]
